experiment_name: geneformer-guanyu
environment:
  env_variables:
    NCCL_DEBUG: "INFO"
  dependencies: dependencies.yaml
compute:
  gpus: 8
  gpu_type: a10
max_retries: 0

command: |-
  train_path="/Workspace/Users/guanyu.chen@databricks.com/composer_geneformer/"
  cd $train_path
  echo ">>> In latest_module folder: $train_path"
  sh commands.sh
  echo ">>> Starting training"
  export MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING=true
  composer train.py parameters.yaml