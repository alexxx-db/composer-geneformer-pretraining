experiment_name: geneformer-guanyu
environment:
  env_variables:
    NCCL_DEBUG: "INFO"
  dependencies: dependencies.yaml
compute:
  gpus: 8
  gpu_type: a10
max_retries: 0
code_source:
  type: snapshot
  snapshot:
    # git_branch: sgc_cli_guanyu
    # git_commit: 9de28424209f0950c9d3204967e8742a7ac5a148
    repo_path: /Users/guanyu.chen/Documents/Projects/composer_geneformer_pretrain/
command: |-
  cd hello_world
  echo ">>> In hello_world folder, starting training"
  TRAIN_SCRIPT="train_guanyu.py"
   
  torchrun \
    --nnodes=2 \
    --nproc_per_node=1 \
    --node_rank=$NODE_RANK \
    --master_addr=$MASTER_ADDR \
    --master_port=$MASTER_PORT \
    $TRAIN_SCRIPT