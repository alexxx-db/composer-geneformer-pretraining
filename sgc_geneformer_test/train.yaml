# - experiment_name: Field required
# - environment: Field required
# - compute.gpu_type: Field required
# - compute.cluster: Extra inputs are not permitted
# - name: Extra inputs are not permitted
# - image: Extra inputs are not permitted
# - integrations: Extra inputs are not permitted
# - scheduling: Extra inputs are not permitted
experiment_name: geneformer-guanyu
environment:
  env_variables:
    NCCL_DEBUG: "INFO"
  dependencies: dependencies.yaml
compute:
  gpus: 8
  gpu_type: a10
max_retries: 0
code_source:
  type: snapshot
  snapshot:
    git_branch: sgc_cli_guanyu
    repo_path: /home/username/repo
command: |-
  cd /Workspace/Users/guanyu.chen@databricks.com/sgc-cli-test/latest_module/
  echo ">>> In latest_module folder, starting training"
  TRAIN_SCRIPT="./train_guanyu.py"
   
  torchrun \
    --nnodes=2 \
    --nproc_per_node=1 \
    --node_rank=$NODE_RANK \
    --master_addr=$MASTER_ADDR \
    --master_port=$MASTER_PORT \
    $TRAIN_SCRIPT