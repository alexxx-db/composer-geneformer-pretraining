experiment_name: torchrun-hello-world-guanyu
environment:
  env_variables:
    NCCL_DEBUG: "INFO"
  dependencies: dependencies.yaml
compute:
  gpus: 2
  gpu_type: a10
max_retries: 0
command: |-

  TRAIN_SCRIPT="/Workspace/Users/guanyu.chen@databricks.com/sgc-cli-test/train_guanyu.py"
   
  torchrun \
    --nnodes=2 \
    --nproc_per_node=1 \
    --node_rank=$NODE_RANK \
    --master_addr=$MASTER_ADDR \
    --master_port=$MASTER_PORT \
    $TRAIN_SCRIPT
